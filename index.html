<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>জিমেইল সেল ও উইথড্র সার্ভিস</title>
</head>
<body>

    <h2>গরিবের টাকা ড্যাশবোর্ড</h2>
    <p><strong>বর্তমান ব্যালেন্স:</strong> ৳ <span id="userBalance">0.00</span></p>

    <hr>

    <!-- ১. জিমেইল সেল সেকশন -->
    <h3>১. জিমেইল জমা দিন (প্রতি জিমেইল ৳১৪)</h3>
    <form id="saveGmailForm">
        <label>জিমেইল:</label><br>
        <input type="email" id="gAddress" required placeholder="example@gmail.com"><br><br>
        <label>পাসওয়ার্ড:</label><br>
        <input type="text" id="gPass" required placeholder="পাসওয়ার্ড"><br><br>
        <label>রিকভারি ইমেইল (ঐচ্ছিক):</label><br>
        <input type="email" id="gRec" placeholder="recovery@example.com"><br><br>
        <button type="submit">জমা দিন</button>
    </form>

    <hr>

    <!-- ২. টাকা উত্তোলন সেকশন -->
    <h3>২. টাকা তুলুন (সর্বনিম্ন ৳১০০)</h3>
    <form id="withdrawForm">
        <label>পেমেন্ট মেথড:</label><br>
        <select id="wMethod">
            <option value="bkash">বিকাশ</option>
            <option value="nagad">নগদ</option>
        </select><br><br>
        <label>মোবাইল নম্বর:</label><br>
        <input type="text" id="wPhone" required placeholder="017XXXXXXXX"><br><br>
        <label>পরিমাণ (৳):</label><br>
        <input type="number" id="wAmount" min="100" required placeholder="100"><br><br>
        <button type="submit">উইথড্র রিকোয়েস্ট দিন</button>
    </form>

    <hr>

    <!-- ৩. রেফার সেকশন -->
    <h3>৩. রেফার লিংক (প্রতি বৈধ রেফারে ৳৫)</h3>
    <input type="text" id="refLinkInput" readonly style="width: 80%;">
    <button onclick="copyRefLink()">কপি করুন</button>

    <hr>

    <!-- ৪. এডমিন প্যানেল সেকশন -->
    <h3>৪. এডমিন প্যানেল</h3>
    <button onclick="openAdminModal()">এডমিন প্যানেল খুলুন</button>

    <div id="adminArea" style="display: none; margin-top: 15px; border: 1px solid #000; padding: 10px;">
        <h4>জমা পড়া জিমেইল তালিকা</h4>
        <button onclick="clearData()" style="color: red;">সব ডাটা মুছুন</button><br><br>
        <table border="1" cellpadding="5" cellspacing="0">
            <thead>
                <tr>
                    <th>Gmail</th>
                    <th>Password</th>
                    <th>Recovery</th>
                </tr>
            </thead>
            <tbody id="adminTableBody"></tbody>
        </table>
    </div>

    <script>
        const GMAIL_RATE = 14;     // ১৪ টাকা প্রতি জিমেইল
        const REFERRAL_BONUS = 5;  // ৫ টাকা বৈধ রেফার বোনাস

        // পেইজ লোড হওয়ার সাথে সাথে আইডি ও ব্যালেন্স সেটআপ
        window.addEventListener('load', function() {
            let myUserId = localStorage.getItem('myUserId');
            if (!myUserId) {
                myUserId = 'user_' + Math.floor(100000 + Math.random() * 900000);
                localStorage.setItem('myUserId', myUserId);
            }

            // রেফার লিংক তৈরি
            const currentUrl = window.location.origin + window.location.pathname;
            document.getElementById('refLinkInput').value = `${currentUrl}?ref=${myUserId}`;

            // রেফারেন্স চেকিং
            const urlParams = new URLSearchParams(window.location.search);
            const referredBy = urlParams.get('ref');
            if (referredBy && referredBy !== myUserId && !localStorage.getItem('referredByCode')) {
                localStorage.setItem('referredByCode', referredBy);
            }

            // ব্যালেন্স রেন্ডার
            let savedBalance = localStorage.getItem('userBalance') || "0.00";
            document.getElementById('userBalance').innerText = parseFloat(savedBalance).toFixed(2);
        });

        // জিমেইল সেভ ও বোনাস হিসাব
        document.getElementById('saveGmailForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const gmail = document.getElementById('gAddress').value.trim().toLowerCase();
            const pass = document.getElementById('gPass').value;
            const rec = document.getElementById('gRec').value.trim() || 'নেই';

            let savedList = JSON.parse(localStorage.getItem('submittedGmails') || "[]");

            // ডুप्लिकোট চেক
            const isDuplicate = savedList.some(item => item.gmail.toLowerCase() === gmail);
            if (isDuplicate) {
                alert('এই জিমেইলটি ইতোমধ্যে জমা দেওয়া হয়েছে!');
                return;
            }

            // জিমেইল সংরক্ষণ
            savedList.push({ gmail: gmail, pass: pass, rec: rec });
            localStorage.setItem('submittedGmails', JSON.stringify(savedList));

            // সেল বোনাস যোগ (৳১৪)
            let currentBalance = parseFloat(localStorage.getItem('userBalance') || "0.00");
            let newBalance = currentBalance + GMAIL_RATE;
            localStorage.setItem('userBalance', newBalance.toFixed(2));
            document.getElementById('userBalance').innerText = newBalance.toFixed(2);

            // বৈধ রেফারেল বোনাস লজিক (৳৫)
            let referrer = localStorage.getItem('referredByCode');
            let hasCompletedFirstSale = localStorage.getItem('completedFirstSale');

            if (referrer && !hasCompletedFirstSale) {
                localStorage.setItem('completedFirstSale', 'true');
                let refData = JSON.parse(localStorage.getItem('referralBonusPool') || "{}");
                refData[referrer] = (refData[referrer] || 0) + REFERRAL_BONUS;
                localStorage.setItem('referralBonusPool', JSON.stringify(refData));

                alert(`জিমেইল জমা সফল হয়েছে! আপনি পেয়েছেন ৳${GMAIL_RATE}। আপনার রেফারকারী পেয়েছেন ৳${REFERRAL_BONUS} বোনাস।`);
            } else {
                alert(`জিমেইল সফলভাবে জমা হয়েছে! আপনি ৳${GMAIL_RATE} পেয়েছেন।`);
            }

            document.getElementById('saveGmailForm').reset();
        });

        // উইথড্র রিকোয়েস্ট
        document.getElementById('withdrawForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const amount = parseFloat(document.getElementById('wAmount').value);
            let currentBalance = parseFloat(localStorage.getItem('userBalance') || "0.00");

            if (amount > currentBalance) {
                alert('আপনার পর্যাপ্ত ব্যালেন্স নেই!');
                return;
            }

            let newBalance = currentBalance - amount;
            localStorage.setItem('userBalance', newBalance.toFixed(2));
            document.getElementById('userBalance').innerText = newBalance.toFixed(2);

            alert('উইথড্র রিকোয়েস্ট সফলভাবে সম্পন্ন হয়েছে!');
            document.getElementById('withdrawForm').reset();
        });

        // এডমিন প্যানেল যাচাই (পাসওয়ার্ড: 2580)
        function openAdminModal() {
            const pass = prompt("এডমিন পাসওয়ার্ড দিন:");
            if (pass === "2580") {
                loadAdminData();
                document.getElementById('adminArea').style.display = 'block';
            } else if (pass !== null) {
                alert("ভুল পাসওয়ার্ড!");
            }
        }

        // এডমিন ডাটা রেন্ডার
        function loadAdminData() {
            let savedList = JSON.parse(localStorage.getItem('submittedGmails') || "[]");
            let tbody = document.getElementById('adminTableBody');
            tbody.innerHTML = "";

            if (savedList.length === 0) {
                tbody.innerHTML = "<tr><td colspan='3'>কোনো জিমেইল জমা পড়েনি</td></tr>";
                return;
            }

            savedList.forEach(item => {
                tbody.innerHTML += `<tr>
                    <td>${item.gmail}</td>
                    <td>${item.pass}</td>
                    <td>${item.rec}</td>
                </tr>`;
            });
        }

        // ডাটা রিসেট
        function clearData() {
            if (confirm("সব জমা পড়া জিমেইল মুছে ফেলতে চান?")) {
                localStorage.removeItem('submittedGmails');
                loadAdminData();
            }
        }

        // রেফার লিংক কপি
        function copyRefLink() {
            var copyText = document.getElementById("refLinkInput");
            copyText.select();
            navigator.clipboard.writeText(copyText.value);
            alert("রেফার লিংক কপি হয়েছে!");
        }
    </script>
</body>
</html>
