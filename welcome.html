<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gmail Earn Pro - জিমেইল বিক্রি করে ইনকাম করুন</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        body { background-color: #f4f7f6; color: #333; }
        header { background: #d93025; color: white; padding: 15px 20px; text-align: center; }
        .container { max-width: 900px; margin: 20px auto; padding: 0 15px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; }
        .card h3 { color: #666; font-size: 14px; margin-bottom: 5px; }
        .card p { font-size: 24px; font-weight: bold; color: #d93025; }
        .form-section { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .form-section h2 { margin-bottom: 15px; font-size: 20px; color: #1a73e8; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 600; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; }
        .btn { background: #1a73e8; color: white; border: none; padding: 12px 20px; border-radius: 5px; cursor: pointer; font-size: 16px; width: 100%; font-weight: bold; }
        .btn:hover { background: #1557b0; }
        .btn-withdraw { background: #28a745; margin-top: 10px; }
        .btn-withdraw:hover { background: #218838; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        table, th, td { border: 1px solid #ddd; }
        th, td { padding: 10px; text-align: left; font-size: 14px; }
        th { background: #f8f9fa; }
        .status-pending { color: #ffc107; font-weight: bold; }
        .status-approved { color: #28a745; font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <h1>Gmail Earn Pro</h1>
        <p>জিমেইল জমা দিন এবং সাথে সাথে টাকা আয় করুন</p>
    </header>

    <div class="container">
        <!-- Dashboard Statistics -->
        <div class="stats-grid">
            <div class="card">
                <h3>মোট জমা দেওয়া জিমেইল</h3>
                <p id="totalSubmitted">0 টি</p>
            </div>
            <div class="card">
                <h3>প্রতি জিমেইল রেট</h3>
                <p>৳ ১০.০০</p>
            </div>
            <div class="card">
                <h3>বর্তমান ব্যালেন্স</h3>
                <p id="totalBalance">৳ 0.00</p>
            </div>
        </div>

        <!-- Submit Gmail Form -->
        <div class="form-section">
            <h2>নতুন জিমেইল জমা দিন</h2>
            <form id="gmailForm">
                <div class="form-group">
                    <label for="gmail">জিমেইল এড্রেস</label>
                    <input type="email" id="gmail" placeholder="example@gmail.com" required>
                </div>
                <div class="form-group">
                    <label for="password">পাসওয়ার্ড</label>
                    <input type="text" id="password" placeholder="জিমেইলের পাসওয়ার্ড" required>
                </div>
                <div class="form-group">
                    <label for="recovery">রিকভারি ইমেইল (যদি থাকে)</label>
                    <input type="email" id="recovery" placeholder="recovery@example.com">
                </div>
                <button type="submit" class="btn">জিমেইল জমা দিন</button>
            </form>
        </div>

        <!-- Withdraw Section -->
        <div class="form-section">
            <h2>টাকা তুলুন (Withdraw)</h2>
            <form id="withdrawForm">
                <div class="form-group">
                    <label for="method">পেমেন্ট মেথড</label>
                    <select id="method" required>
                        <option value="bkash">বিকাশ (bKash)</option>
                        <option value="nagad">নগদ (Nagad)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="accountNumber">পার্সোনাল মোবাইল নম্বর</label>
                    <input type="text" id="accountNumber" placeholder="017XXXXXXXX" required>
                </div>
                <div class="form-group">
                    <label for="amount">টাকার পরিমাণ (সর্বনিম্ন ৳ ৫০)</label>
                    <input type="number" id="amount" min="50" placeholder="50" required>
                </div>
                <button type="submit" class="btn btn-withdraw">উইথড্র রিকোয়েস্ট পাঠান</button>
            </form>
        </div>

        <!-- Submitted History -->
        <div class="form-section">
            <h2>আপনার জিমেইল জমার হিস্ট্রি</h2>
            <table>
                <thead>
                    <tr>
                        <th>তারিখ</th>
                        <th>জিমেইল</th>
                        <th>পাসওয়ার্ড</th>
                        <th>স্ট্যাটাস</th>
                    </tr>
                </thead>
                <tbody id="historyTable">
                    <!-- Dynamic Data will appear here -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let submittedCount = 0;
        let balance = 0;
        const ratePerGmail = 10; // প্রতি জিমেইলের দাম ১০ টাকা

        document.getElementById('gmailForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const gmail = document.getElementById('gmail').value;
            const password = document.getElementById('password').value;
            const date = new Date().toLocaleDateString();

            // Update Stats
            submittedCount++;
            balance += ratePerGmail;

            document.getElementById('totalSubmitted').innerText = submittedCount + " টি";
            document.getElementById('totalBalance').innerText = "৳ " + balance.toFixed(2);

            // Add to Table
            const table = document.getElementById('historyTable');
            const row = table.insertRow(0);
            row.innerHTML = `
                <td>${date}</td>
                <td>${gmail}</td>
                <td>${password}</td>
                <td><span class="status-pending">Pending Review</span></td>
            `;

            alert("জিমেইল সফলভাবে জমা হয়েছে! অ্যাডমিন চেক করে এপ্রুভ করবেন।");
            document.getElementById('gmailForm').reset();
        });

        document.getElementById('withdrawForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const amount = parseFloat(document.getElementById('amount').value);
            const number = document.getElementById('accountNumber').value;

            if (amount > balance) {
                alert("আপনার ওয়ালেটে পর্যাপ্ত ব্যালেন্স নেই!");
            } else {
                balance -= amount;
                document.getElementById('totalBalance').innerText = "৳ " + balance.toFixed(2);
                alert(`৳ ${amount} টাকা ${number} নম্বরে উইথড্র রিকোয়েস্ট সফল হয়েছে!`);
                document.getElementById('withdrawForm').reset();
            }
        });
    </script>
</body>
</html>
